spring.datasource.url=jdbc:h2:mem:text_to_learn;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true

app.cors.allowed-origins=http://localhost:5173
app.rabbitmq.declare-on-startup=false

auth0.issuer-uri=
auth0.audience=

ai.provider=gemini

gemini.api-key=
gemini.base-url=https://generativelanguage.googleapis.com/v1beta
gemini.model=gemini-2.5-flash
gemini.tts-model=gemini-2.5-flash-preview-tts
gemini.tts-voice-name=Kore
gemini.audio-max-input-characters=6000

openai.api-key=
openai.base-url=https://api.openai.com/v1
openai.model=gpt-5-mini

youtube.api-key=
youtube.base-url=https://www.googleapis.com/youtube/v3
youtube.max-results=3
youtube.cache-ttl-minutes=1440

r2.account-id=
r2.access-key-id=
r2.secret-access-key=
r2.bucket-name=
r2.endpoint=
