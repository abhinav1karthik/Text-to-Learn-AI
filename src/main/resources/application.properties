spring.application.name=text-to-learn
server.port=8081


# Local PostgreSQL is used by default.
# For Neon/deployment, set these environment variables:
# SPRING_DATASOURCE_URL
# SPRING_DATASOURCE_USERNAME
# SPRING_DATASOURCE_PASSWORD
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/text_to_learn}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:text_to_learn}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:text_to_learn}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true

spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
spring.rabbitmq.listener.simple.acknowledge-mode=manual
spring.rabbitmq.listener.simple.prefetch=1
spring.rabbitmq.listener.simple.default-requeue-rejected=false

app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174}
app.generation.republisher.enabled=${APP_GENERATION_REPUBLISHER_ENABLED:true}
app.generation.republisher.fixed-delay-ms=${APP_GENERATION_REPUBLISHER_FIXED_DELAY_MS:5000}
app.generation.recovery.enabled=${APP_GENERATION_RECOVERY_ENABLED:true}
app.generation.recovery.fixed-delay-ms=${APP_GENERATION_RECOVERY_FIXED_DELAY_MS:60000}

auth0.issuer-uri=${AUTH0_ISSUER_URI:}
auth0.audience=${AUTH0_AUDIENCE:}
auth0.jwk-set-uri=${AUTH0_JWK_SET_URI:}

ai.provider=${AI_PROVIDER:gemini}

gemini.api-key=${GEMINI_API_KEY:}
gemini.base-url=${GEMINI_BASE_URL:https://generativelanguage.googleapis.com/v1beta}
gemini.model=${GEMINI_MODEL:gemini-2.5-flash}
gemini.tts-model=${GEMINI_TTS_MODEL:gemini-2.5-flash-preview-tts}
gemini.tts-voice-name=${GEMINI_TTS_VOICE_NAME:Kore}
gemini.audio-max-input-characters=${GEMINI_AUDIO_MAX_INPUT_CHARACTERS:6000}

openai.api-key=${OPENAI_API_KEY:}
openai.base-url=${OPENAI_BASE_URL:https://api.openai.com/v1}
openai.model=${OPENAI_MODEL:gpt-5-mini}

youtube.api-key=${YOUTUBE_API_KEY:}
youtube.base-url=${YOUTUBE_BASE_URL:https://www.googleapis.com/youtube/v3}
youtube.max-results=${YOUTUBE_MAX_RESULTS:3}
youtube.cache-ttl-minutes=${YOUTUBE_CACHE_TTL_MINUTES:1440}

r2.account-id=${R2_ACCOUNT_ID:}
r2.access-key-id=${R2_ACCESS_KEY_ID:}
r2.secret-access-key=${R2_SECRET_ACCESS_KEY:}
r2.bucket-name=${R2_BUCKET_NAME:}
r2.endpoint=${R2_ENDPOINT:}

server.error.include-message=always
