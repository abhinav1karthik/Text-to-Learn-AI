spring.application.name=text-to-learn
server.port=8081


# Local PostgreSQL is used by default.
# For Neon/deployment, set these environment variables:
# SPRING_DATASOURCE_URL
# SPRING_DATASOURCE_USERNAME
# SPRING_DATASOURCE_PASSWORD
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/text_to_learn}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:text_to_learn}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:text_to_learn}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true

app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174}

auth0.issuer-uri=${AUTH0_ISSUER_URI:}
auth0.audience=${AUTH0_AUDIENCE:}

ai.provider=${AI_PROVIDER:gemini}

gemini.api-key=${GEMINI_API_KEY:}
gemini.base-url=${GEMINI_BASE_URL:https://generativelanguage.googleapis.com/v1beta}
gemini.model=${GEMINI_MODEL:gemini-2.5-flash}

openai.api-key=${OPENAI_API_KEY:}
openai.base-url=${OPENAI_BASE_URL:https://api.openai.com/v1}
openai.model=${OPENAI_MODEL:gpt-5-mini}

server.error.include-message=always
